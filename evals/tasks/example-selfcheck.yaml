# A self-contained smoke task that proves the harness works end to end.
# It points at THIS repo, so it runs with no setup. Delete it once you have
# five real tasks — a task that always passes carries no information.
#
# Note the output path is NOT gitignored, on purpose: a task whose output is
# invisible to `git diff` would pass its diff criterion vacuously.

id: example-selfcheck
repo: .
sha: HEAD
prompt: |
  สร้างไฟล์ใหม่ชื่อ eval-smoke-output.txt ที่ root ของ repo
  ให้มีข้อความบรรทัดเดียวว่า hello
  ห้ามแก้ไฟล์อื่น
tags: [smoke]

criteria:
  - type: cmd
    cmd: test -f eval-smoke-output.txt && grep -q hello eval-smoke-output.txt
    label: file created with expected content

  - type: diff
    allow:
      - "eval-smoke-output.txt"
    max_lines: 5
    label: touched only the expected file
