# วิดีโอประกอบต่อโมดูล — supplementary viewing
#
# ขอบเขตที่ตั้งใจไม่ข้าม
#   ✅ ทำได้   อ้างอิงเป็นลิงก์ + ชื่อคลิป + บอกว่าควรดูก่อน/หลังโมดูลไหน
#   ❌ ไม่ทำ   ถอดเนื้อหาคลิป สรุปยาว หรือเอามาเป็นบทเรียนในคอร์ส
# เนื้อหาบทเรียนเป็นของเราเอง วิดีโอเป็นของผู้สร้างคลิป ผู้เรียนไปดูที่ต้นทาง
#
# วิธีเติม
#   1. วาง entry ใต้ module id ที่ต้องการ
#   2. bun run build:site
#   3. หน้าเว็บ render ให้เอง ไม่ต้องแก้ HTML
#
# schema ต่อหนึ่งรายการ
#   title    ชื่อคลิปตามต้นทาง (ห้ามแต่งเอง)
#   url      ลิงก์เต็ม
#   channel  ชื่อช่อง
#   when     before | after | optional   ควรดูก่อนเรียน / หลังเรียน / เสริม
#   note     หนึ่งบรรทัดว่าทำไมถึงแนะนำคลิปนี้ตรงนี้ (เขียนเอง ไม่ใช่คำโปรยของคลิป)

