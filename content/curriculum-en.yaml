# English strings for the portal. Structure lives in curriculum.yaml — this file
# only carries translatable text, keyed by the same ids, so the two can never
# disagree about how many modules or lessons there are.

course:
  subtitle: A deep edition — filling the 8 gaps most courses skip
  level: Intermediate–Advanced

phases:
  p0: Foundations — understand the mechanism, don't memorise commands
  p1: Plan — the cheapest place in the whole SDLC to catch a mistake
  p2: Build — greenfield and the code you already have
  p3: Extend — from tool user to tool builder
  p4: Verify — what separates a toy from something you ship
  p5: Ship & operate — from your machine to the whole team

gaps:
  G1:
    title: Evals — measuring your own agent system
    why: The largest gap. If you cannot measure, you are tuning prompts on feeling. LLM variance is wide enough that "it felt better" is pure noise.
  G2:
    title: Security and the agent threat model
    why: A coding agent has a threat model unlike a web app's, and an installed skill is code running with your privileges.
  G3:
    title: Context engineering
    why: The clearest dividing line between people who use agents well and people who don't — and it pays back more than changing models.
  G4:
    title: Brownfield and legacy
    why: Labs that start from an empty folder teach work almost nobody does. Real work is a six-year-old codebase with no tests.
  G5:
    title: Token and model economics
    why: Cost decides whether a workflow survives a team of twenty or only works for you alone.
  G6:
    title: An agent-ready codebase
    why: Repo structure pays back permanently; a better prompt pays back once.
  G7:
    title: Multi-agent orchestration
    why: Multi-agent is an architecture, not a feature — and the most important lesson is when it loses to a single agent.
  G8:
    title: Governance and real team adoption
    why: Most courses end at "you can use an agent now". The real problems start when fifteen people use one at once.

modules:
  m01:
    title: How an agent actually works
    goal: See that an agent is an ordinary loop wrapped in engineering, so you can debug it when it misbehaves
    outcome: You can name which layer of the harness a strange behaviour came from
    lessons:
      - What the agentic loop really is, and why that is enough
      - Anatomy of a harness — system prompt, tool registry, context assembler, permission layer, result renderer
      - The tool-use protocol — parallel calls, error results, and why every result must come back in one message
      - Every stop reason, and how to handle each one
      - Thinking and effort — how depth changes tool-call behaviour, not just quality
      - The permission model, and why "allow everything" is security debt
      - Seven ways agents fail, and which layer fixes each
      - "LAB: write a ~150-line mini-harness — loop, three tools, permission gate"
  m02:
    title: Context engineering
    goal: Treat context as a budget to manage, not a bucket to fill until it overflows
    outcome: 30–60% lower cost per task at equal or better quality
    lessons:
      - The context window is a budget, not storage — a million tokens still needs managing
      - Four rules for what belongs in context — relevant, fresh, cheaply rendered, re-findable
      - Attention dilution — why quality drops before the window is full
      - The memory hierarchy, and what belongs at each level
      - Writing a project memory file that earns its keep
      - Three mechanisms people confuse — compaction, context editing, and an external memory
      - Sub-agents as a context barrier, not just parallelism
      - Retrieval or stuffing — when to attach and when to let it search
      - "LAB: cut 40% of context and measure whether quality moves"
  m03:
    title: Token and model economics
    goal: Decide about cost with arithmetic instead of a feeling that a model is expensive
    outcome: You can say which model and effort level a task deserves, with data behind it
    lessons:
      - The four token columns — input, output, cache write, cache read
      - Prompt caching in depth — prefix matching and render order
      - Silent cache killers, and a five-minute audit that finds them
      - Routing models by economics — which work repays which tier
      - Cost per completed task, not per request
      - Effort before model — the lever to pull first, and the cache trap in cascades
      - Batch, task budgets, and ceilings the agent can actually see
      - "LAB: profile a week of real work and find three levers"
  m04:
    title: Requirements, research and decomposition
    goal: Turn a vague request into a spec an agent can satisfy and a script can check
    outcome: Noticeably less re-prompting, because the first attempt already had acceptance criteria
    lessons:
      - Spec-first — how an instruction differs from a specification
      - Task size that fits an agent
      - Four criteria for whether a task should go to an agent at all
      - The research loop — separating find, summarise and decide
      - Evidence discipline — every claim carries a file, a line or a URL
      - Decision records the next agent can actually build on
      - Reviewing the plan before any code — the highest-return lesson in the course
      - "LAB: turn one page of vague requirements into a spec, a task graph and decision records"
  m05:
    title: Designing a codebase agents can work in
    goal: Invest in repo structure, which pays back permanently, instead of prompts, which pay back once
    outcome: A repo a fresh agent can work in without being briefed
    lessons:
      - Legibility — machine-readable differs from human-readable
      - File layout and naming that cut search cost
      - Error messages as the agent's feedback channel
      - Test affordance — if targeted tests are slow, the agent stops running them and guesses
      - Types and schemas as the cheapest guardrail you can buy
      - Docs as context — decision records, runbooks and design systems as input
      - The context-file hierarchy and how rules override each other
      - "LAB: audit a real repo and make five changes that cut tokens per task by 30%"
  m06:
    title: Frontend implementation
    goal: Get UI that is actually correct, not UI that merely looks correct in a screenshot
    outcome: A frontend loop where the agent checks its own work before you see it
    lessons:
      - The order you cannot skip — tokens, components, pages, flows
      - The design system as context, not just a picture
      - The server/client boundary agents get wrong most often
      - State and data fetching — what agents get right and what they habitually break
      - The visual verification loop
      - Accessibility as an automatically checkable criterion
      - UI that passes a glance but fails in use
      - "LAB A: build a component library from design tokens"
      - "LAB B: build a three-page flow with a verification pass"
  m07:
    title: Backend and anything that touches data
    goal: Work on the backend without migrations and data operations turning into accidents
    outcome: A set of data guardrails you can apply to your own repo immediately
    lessons:
      - Contract-first — schemas as a spec that checks itself
      - Layering agents navigate easily, and layering that loses them
      - Database migrations — the most dangerous work in the course, and the guardrails it needs
      - Idempotency, transaction boundaries and an error taxonomy an agent can act on
      - Secrets and environment handling — the rules that do not bend
      - Background jobs, queues and retries — three things agents routinely design wrong
      - Observability from the first line, because logs are how the agent debugs itself next time
      - "LAB A: build an API from a contract, with a reversible migration"
      - "LAB B: have the agent find a real bug from logs alone"
  m08:
    title: Brownfield and legacy code
    goal: Real work does not start from an empty folder — this is the module you will use most
    outcome: An approach that works on code you did not write and nobody will explain
    lessons:
      - Onboarding an agent to half a million lines — map before you touch
      - Characterization tests — pin current behaviour before changing anything
      - The strangler pattern with an agent
      - Working with code that has no tests and no types
      - Reading history as context — blame, old pull requests, past incidents
      - Changing safely — blast radius, flags, and a rollback plan written first
      - "LAB: add a feature to a real open-source repo you have never seen"
  m09:
    title: Tooling — MCP, skills, hooks, plugins
    goal: Build tools an agent uses correctly, and know when not to build one at all
    outcome: A team toolkit that gives everyone the same behaviour once installed
    lessons:
      - What MCP actually is — a protocol, not a library
      - Transports and auth, and credentials that never reach the context
      - A tool description is a prompt, not API documentation
      - The token cost of a tool registry, and loading tools on demand
      - Skills — packaging a workflow as knowledge loaded only when relevant
      - Writing a skill description that triggers at the right moment
      - Hooks and the full lifecycle — enforcing what a prompt can only request
      - Plugins and slash commands — shipping one toolkit to the whole team
      - When not to build an MCP server — a plain script wins more often than people expect
      - "LAB: build a server, a skill and a hook that genuinely enforce a team convention"
  m10:
    title: Multi-agent orchestration
    goal: Use several agents where it genuinely wins, and recognise when it loses to one
    outcome: Your own criteria for which work is worth splitting
    lessons:
      - The only two valid reasons — context isolation and genuine parallelism
      - "Pattern 1 — orchestrator and worker: who holds the plan, who holds the context"
      - "Pattern 2 — pipeline: every stage with a structured contract"
      - "Pattern 3 — fan-out and fan-in: merging results without exploding context"
      - "Pattern 4 — judge and critic: always separate the author from the reviewer"
      - The handoff protocol — what must travel, and what would poison the next context
      - When multi-agent loses — runaway cost, inconsistent results, and no way to debug
      - "LAB: build a three-stage review pipeline and measure whether it beats one agent"
  m11:
    title: Testing and QA
    goal: Get tests that catch real bugs, not tests that certify the bug is still there
    outcome: Real numbers for how much your review tooling catches and how often it cries wolf
    lessons:
      - Traps in agent-written tests — pinning wrong behaviour and mocking away the subject
      - How coverage lies when an AI writes the tests
      - Tests as the spec — write them first, then have the agent make them pass
      - Property-based and fuzz testing, where agents have a clear edge
      - End-to-end tests that are not flaky
      - Designing a review agent that finds real bugs instead of style opinions
      - The verification pass — why every finding must be confirmed before it is reported
      - "LAB: measure precision and recall against twenty planted bugs"
  m12:
    title: Evals — measuring your own agent system
    goal: The module other courses skip. Without measurement you are tuning prompts on feeling
    outcome: A tool that puts a number behind every claim that one approach is better
    lessons:
      - Why "it felt better" cannot be trusted — variance is wider than most prompt changes
      - Building a golden task set from real backlog, not invented examples
      - Deterministic criteria first — compiles, tests pass, diff stays in scope
      - LLM-as-judge — rubrics, position bias, and why the judge must be at least as capable
      - A regression suite for prompts, skills and context files
      - Measuring four dimensions at once — correctness, cost, latency, human intervention
      - A/B-ing a workflow change with enough samples to believe the result
      - Drift detection — a new model can quietly make an old workflow worse
      - "LAB: build a twenty-task harness and settle one real team argument with it"
  m13:
    title: Security and the threat model
    goal: An agent that reads the outside world and runs commands is a new attack surface
    outcome: A list of real holes in your own setup, and the ones you closed
    lessons:
      - Why the old security checklist does not cover this
      - Prompt injection through anything the agent reads — issues, dependency docs, pages, logs, filenames
      - Tool poisoning and rug-pulls, when a description changes after you vetted it
      - The supply chain of skills, plugins and servers — installed code runs with your privileges
      - Designing permission boundaries, including outbound network
      - Secret handling, and why a leak into context cannot be undone
      - Exfiltration paths that look completely ordinary one action at a time
      - Autonomous agents and blast radius
      - "LAB: red-team your own workflow with five planted injections"
  m14:
    title: CI/CD and agents in the pipeline
    goal: Put an agent in the pipeline while keeping a human stop point and a sane bill
    outcome: A pipeline the agent can work in that still stops where a person decides
    lessons:
      - How CI differs from your machine — nobody answers questions and nobody watches
      - Pull-request automation, and the line not to cross
      - Quality gates that actually block — deterministic checks before any model opinion
      - Making the agent a CLI you can wrap in a script
      - Scheduled work and the guardrails it needs first
      - CI cost blowups, and the one number to put on a dashboard
      - Rollback and incidents when the commit came from an agent
      - "LAB: ship a review bot with a gate that blocks on high-severity findings"
  m15:
    title: Operations, governance and real team adoption
    goal: The real problems start when the whole team uses this at once, not when you do
    outcome: A policy and rollout plan you can take to your manager as-is
    lessons:
      - Runbooks an agent can execute, which turn out to help new engineers too
      - Log triage and incident response — what to delegate and what never to
      - Documentation automation that does not rot into noise
      - Trust calibration, and what lets you raise the level honestly
      - Code review culture when the diff is ten times bigger
      - Attribution, licensing and legal exposure
      - Team skill atrophy — which abilities you must keep to review the work at all
      - Rolling out across an organisation — pilot, policy, platform, in that order
      - "LAB: write a two-page AI engineering policy that is actually enforceable"

